[global]
  workgroup = INVESTPRO
  server string = InvestPro File Server
  netbios name = FS-SRV
  security = user
  map to guest = never
  guest account = nobody
  # Безопасность
  encrypt passwords = yes
  smb encrypt = required
  client min protocol = SMB3
  server min protocol = SMB3
  # Производительность и безопасность
  socket options = TCP_NODELAY SO_RCVBUF=65536 SO_SNDBUF=65536
  deadtime = 15
  # Логирование
  log file = /var/log/samba/log.%m
  max log size = 1000
  log level = 1

[Share]
  path = /share
  browseable = yes
  writable = yes
  valid users = @all_users
  create mask = 0770
  directory mask = 0770
  force group = all_users

[Clients]
  path = /share/clients
  browseable = yes
  writable = yes
  valid users = @all_users
  read list = @all_users
  write list = boss, @finance_users
  create mask = 0770
  directory mask = 0770
  force group = all_users
  comment = Клиентские данные

[Finance]
  path = /share/finance
  browseable = yes
  writable = yes
  valid users = @finance_users
  read list = @finance_users
  write list = boss, accountant
  create mask = 0770
  directory mask = 0770
  force group = finance_users
  comment = Финансовая отчетность

[HR]
  path = /share/hr
  browseable = no
  writable = no
  valid users = boss
  read list = boss
  write list = boss
  create mask = 0750
  directory mask = 0750
  comment = Кадровые документы (только для руководства)

[Common]
  path = /share/common
  browseable = yes
  writable = yes
  valid users = @all_users
  guest ok = no
  create mask = 0775
  directory mask = 0775
  force group = all_users
  comment = Общие документы

[Backup]
  path = /share/backup
  browseable = no
  writable = no
  valid users = boss
  read list = boss
  write list = boss
  comment = Резервные копии (только администрация)
